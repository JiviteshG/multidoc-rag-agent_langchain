name: CI/CD

# Triggers: run on every push and pull request to any branch.
# Docker push only happens on main (see jobs.docker.if below).
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

env:
  # GitHub Container Registry image name — change JiviteshG to your GitHub username if different.
  IMAGE_NAME: ghcr.io/jiviteshg/multidoc-rag-agent

jobs:
  # ── Job 1: Run guardrail tests ───────────────────────────────────────────
  test:
    name: Guardrail Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"           # caches pip downloads between runs — speeds up reruns

      # Ensure pip itself is current before installing project deps
      - name: Upgrade pip
        run: pip install --upgrade pip

      - name: Install dependencies
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run unit tests
        env:
          PYTHONPATH: .
        run: pytest tests/ -v

      - name: Run guardrail tests
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LANGCHAIN_API_KEY: ${{ secrets.LANGCHAIN_API_KEY }}
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_PROJECT: "multidoc-rag-agent-ci"
          PYTHONPATH: .        # repo root on path so logic_guards/ is importable
        run: python evals/run_guardrail_tests.py

      # Save the CSV report so you can download it from the Actions UI
      - name: Upload guardrail report
        if: always()                  # upload even if the tests fail
        uses: actions/upload-artifact@v4
        with:
          name: guardrail-report
          path: evals/results/guardrail_eval_report_2.csv
          retention-days: 30

  # ── Job 2: Build and push Docker image ──────────────────────────────────
  docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: test                       # only runs if the test job passes
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    # ^ Only push the image when merging/pushing to main, not on every feature branch

    permissions:
      contents: read
      packages: write                 # needed to push to GitHub Container Registry

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # auto-provided by GitHub, no setup needed

      - name: Extract Docker metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-          # e.g. sha-a1b2c3d  — pinnable, unique per commit
            type=raw,value=latest         # always points to newest main build

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers from the previous build to speed up subsequent builds
          cache-from: type=registry,ref=${{ env.IMAGE_NAME }}:latest
          cache-to: type=inline
